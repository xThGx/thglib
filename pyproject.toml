[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thg_bib"
version = "0.1.0"
authors = [{ name="Thomas Gangl" }]
description = "My first lib. In time it will grow hopefully."
readme = "README.md"
requires-python = ">=3.8"
classifiers = []
dependencies = []

[tool.setuptools.packages.find]
where = ["thglib"]

[tool.pytest.ini_options]
pythonpath = ["filepaths"]
testpaths = ["tests"]